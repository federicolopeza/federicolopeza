name: Breakout

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cyprieng/github-breakout@v1.2.3
        with:
          github_username: federicolopeza
          enable_ghost_bricks: false
          output_path: ./breakout/
          paddle_color: "#10B981"
          ball_color: "#10B981"
          bricks_colors: "#134e3a,#065f46,#059669,#10B981,#6EE7B7"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breakout/
          git commit -m "chore: update breakout contribution game" || true
          git push
